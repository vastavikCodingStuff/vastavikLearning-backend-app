# /etc/nginx/sites-available/vastavik
# Vastavik Learning Platform - Production NGINX Reverse Proxy & WAF Configuration
# Optimized for 2 vCPU / 2-4 GB RAM Linux VPS

upstream fastapi_backend {
    server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# Optional external Judge0 runner upstream
upstream judge0_upstream {
    server 139.84.172.230:2358 max_fails=2 fail_timeout=10s;
}

# Rate Limiting Zones (Defense in Depth)
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_general:10m rate=120r/m;

server {
    listen 80;
    listen [::]:80;
    server_name api.vastaviklearning.com;

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.vastaviklearning.com;

    # SSL Certificates (managed via Certbot Let's Encrypt or Cloudflare Origin CA)
    ssl_certificate /etc/letsencrypt/live/api.vastaviklearning.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.vastaviklearning.com/privkey.pem;

    # SSL Hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Client body limit (50MB for video/screen recording bug reports)
    client_max_body_size 50M;

    # Core REST API
    location /api/v1/ {
        limit_req zone=api_general burst=20 nodelay;

        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        # Route Circuit Breaker Fast-Fail Handler
        proxy_next_upstream error timeout http_502 http_503;
        error_page 502 503 504 = @route_maintenance;
    }

    # Strict Rate-Limiting for Auth
    location /api/v1/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;

        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Real-Time WebSocket for Peer Chat & Socket.IO Fallback
    location /socket.io/ {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Direct WebSockets (Signaling & Peer Chat)
    location /ws/ {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Static Uploads (Screenshots, Bug Recordings, Notes)
    location /uploads/ {
        alias /var/www/vastavik/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Health Check & Docs
    location ~ ^/(health|docs|redoc|openapi.json) {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Circuit Breaker Maintenance JSON response
    location @route_maintenance {
        default_type application/json;
        return 503 '{"status":"MAINTENANCE","error":"SERVICE_TEMPORARILY_OFFLINE","message":"This feature is undergoing scheduled maintenance. Other platform services remain fully operational."}';
    }
}
