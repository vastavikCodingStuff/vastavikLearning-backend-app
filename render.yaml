services:
  - type: web
    name: vastavik-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn app.main:socket_app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: ENFORCE_HMAC
        value: "true"
      - key: API_KEY_ID
        value: vastavik_prod_v1
      - key: API_KEY_SECRET
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: XKIRO_API_KEY
        value: sk-xt-075d80d397e9a363d923b80bd53d65c01463b37b28f60dae
      - key: XKIRO_BASE_URL
        value: https://api.xkiro.com/v1
      - key: MISTRAL_API_KEY
        value: WKifALNZPu4xSxRDeNu0vVumvbjvqao1
